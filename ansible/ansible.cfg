[defaults]
inventory          = inventory/aws_ec2.yml
roles_path         = roles
host_key_checking  = False
retry_files_enabled = False
forks              = 25
timeout            = 60
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = /tmp/lucidity_ansible_facts
fact_caching_timeout = 3600
# Structured operator log (directory is gitignored except .gitkeep)
log_path           = logs/ansible.log
callbacks_enabled  = timer, profile_tasks
stdout_callback    = default
bin_ansible_callbacks = True

# Bounded retries at playbook transport level
[persistent_connection]
connect_timeout = 60
command_timeout = 120

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Unused when using aws_ssm — kept for safety if someone falls back
pipelining = True
