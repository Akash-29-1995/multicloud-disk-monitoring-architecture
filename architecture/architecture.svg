<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <rect width="1100" height="780" fill="#0b1220"/>
  <text x="550" y="36" text-anchor="middle" fill="#f8fafc" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold">Lucidity Disk Monitoring — Complete Flow</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="13">Trigger → Discover → Enroll → Observe continuously</text>
  <rect x="40" y="90" width="220" height="80" rx="10" fill="#152033" stroke="#fbbf24" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" fill="#f1f5f9" font-family="Helvetica,Arial,sans-serif" font-size="14">1. Trigger</text>
  <text x="150" y="145" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12">CLI or Jenkins params</text>
  <rect x="300" y="90" width="260" height="80" rx="10" fill="#152033" stroke="#a78bfa" stroke-width="2"/>
  <text x="430" y="125" text-anchor="middle" fill="#f1f5f9" font-family="Helvetica,Arial,sans-serif" font-size="14">2. Orchestrator</text>
  <text x="430" y="145" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12">customer / account / env</text>
  <rect x="600" y="90" width="260" height="80" rx="10" fill="#152033" stroke="#38bdf8" stroke-width="2"/>
  <text x="730" y="125" text-anchor="middle" fill="#f1f5f9" font-family="Helvetica,Arial,sans-serif" font-size="14">3. AWS Adapter</text>
  <text x="730" y="145" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12">AssumeRole + EC2 API</text>
  <rect x="900" y="90" width="160" height="80" rx="10" fill="#152033" stroke="#38bdf8" stroke-width="2"/>
  <text x="980" y="125" text-anchor="middle" fill="#f1f5f9" font-family="Helvetica,Arial,sans-serif" font-size="14">4. Inventory</text>
  <text x="980" y="145" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">orchestrator-output/</text>
  <rect x="200" y="230" width="280" height="90" rx="10" fill="#152033" stroke="#c084fc" stroke-width="2"/>
  <text x="340" y="270" text-anchor="middle" fill="#f1f5f9" font-family="Helvetica,Arial,sans-serif" font-size="14">5. Ansible enroll-disk-monitoring</text>
  <text x="340" y="290" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12">idempotent agent setup</text>
  <rect x="520" y="230" width="280" height="90" rx="10" fill="#152033" stroke="#22d3ee" stroke-width="2"/>
  <text x="660" y="270" text-anchor="middle" fill="#f1f5f9" font-family="Helvetica,Arial,sans-serif" font-size="14">6. AWS Systems Manager</text>
  <text x="660" y="290" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12">no SSH keys</text>
  <rect x="840" y="230" width="220" height="90" rx="10" fill="#152033" stroke="#34d399" stroke-width="2"/>
  <text x="950" y="270" text-anchor="middle" fill="#f1f5f9" font-family="Helvetica,Arial,sans-serif" font-size="14">7. CloudWatch Agent</text>
  <text x="950" y="290" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12">on each EC2</text>
  <rect x="200" y="390" width="700" height="100" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="430" text-anchor="middle" fill="#ecfdf5" font-family="Helvetica,Arial,sans-serif" font-size="15">8. Continuous observation (data plane)</text>
  <text x="550" y="455" text-anchor="middle" fill="#a7f3d0" font-family="Helvetica,Arial,sans-serif" font-size="12">disk metrics → CloudWatch → Dashboard + Alarms → SNS</text>
  <rect x="200" y="540" width="700" height="140" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
  <text x="550" y="595" text-anchor="middle" fill="#fef3c7" font-family="Helvetica,Arial,sans-serif" font-size="15">Failure isolation</text>
  <text x="550" y="625" text-anchor="middle" fill="#fde68a" font-family="Helvetica,Arial,sans-serif" font-size="13">Jenkins / Orchestrator / Ansible DOWN  →  metrics KEEP flowing if agent is healthy</text>
  <text x="550" y="750" text-anchor="middle" fill="#cbd5e1" font-family="Helvetica,Arial,sans-serif" font-size="13">Control plane sets up once · Data plane runs forever</text>
</svg>
