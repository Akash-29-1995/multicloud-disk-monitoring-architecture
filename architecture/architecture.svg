<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <rect width="960" height="640" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold">Lucidity Disk Monitoring Architecture</text>
  <text x="480" y="58" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12">Ansible enrolls · CloudWatch observes · SSM connects · IAM crosses accounts</text>

  <rect x="280" y="80" width="400" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="480" y="107" text-anchor="middle" fill="#7dd3fc" font-family="Helvetica,Arial,sans-serif" font-size="14">AWS Organization</text>

  <rect x="80" y="160" width="160" height="70" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="160" y="190" text-anchor="middle" fill="#e2e8f0" font-family="Helvetica,Arial,sans-serif" font-size="13">Account A</text>
  <text x="160" y="210" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">EC2 + CW Agent</text>

  <rect x="400" y="160" width="160" height="70" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="480" y="190" text-anchor="middle" fill="#e2e8f0" font-family="Helvetica,Arial,sans-serif" font-size="13">Account B</text>
  <text x="480" y="210" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">EC2 + CW Agent</text>

  <rect x="720" y="160" width="160" height="70" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="800" y="190" text-anchor="middle" fill="#e2e8f0" font-family="Helvetica,Arial,sans-serif" font-size="13">Account N</text>
  <text x="800" y="210" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">EC2 + CW Agent</text>

  <line x1="160" y1="230" x2="160" y2="280" stroke="#64748b"/>
  <line x1="480" y1="230" x2="480" y2="280" stroke="#64748b"/>
  <line x1="800" y1="230" x2="800" y2="280" stroke="#64748b"/>
  <line x1="160" y1="280" x2="800" y2="280" stroke="#64748b"/>
  <line x1="480" y1="280" x2="480" y2="310" stroke="#38bdf8" stroke-width="2"/>

  <rect x="300" y="310" width="360" height="50" rx="6" fill="#0ea5e9" opacity="0.2" stroke="#38bdf8"/>
  <text x="480" y="340" text-anchor="middle" fill="#7dd3fc" font-family="Helvetica,Arial,sans-serif" font-size="13">Cross-account IAM (STS AssumeRole)</text>

  <rect x="200" y="390" width="200" height="70" rx="6" fill="#1e293b" stroke="#a78bfa"/>
  <text x="300" y="420" text-anchor="middle" fill="#c4b5fd" font-family="Helvetica,Arial,sans-serif" font-size="13">Ansible (control)</text>
  <text x="300" y="440" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">enroll / reconcile</text>

  <rect x="560" y="390" width="200" height="70" rx="6" fill="#1e293b" stroke="#34d399"/>
  <text x="660" y="420" text-anchor="middle" fill="#6ee7b7" font-family="Helvetica,Arial,sans-serif" font-size="13">CloudWatch (data)</text>
  <text x="660" y="440" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">metrics / dash / alarms</text>

  <text x="300" y="490" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">via SSM</text>
  <text x="660" y="490" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">SNS / incident</text>

  <rect x="280" y="520" width="400" height="80" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="480" y="550" text-anchor="middle" fill="#fde68a" font-family="Helvetica,Arial,sans-serif" font-size="13">Failure isolation</text>
  <text x="480" y="575" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="11">Ansible down ’ metrics continue · Agent down ’ missing-metric alarm ’ reconcile</text>
</svg>
